name: Automated Nightly Build

on:
  schedule:
    - cron: "20 5,17 * * *" # Runs twice daily: 00:20 and 12:20 in UTC+7 (05:20 and 17:20 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-upstream:
    name: Check Upstream Changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.check.outputs.matrix }}
      has_changes: ${{ steps.check.outputs.has_changes }}
      source_sha: ${{ steps.check.outputs.source_sha }}
      ksu_sha: ${{ steps.check.outputs.ksu_sha }}
      next_sha: ${{ steps.check.outputs.next_sha }}
      susfs_sha: ${{ steps.check.outputs.susfs_sha }}
      nomount_sha: ${{ steps.check.outputs.nomount_sha }}
      vpnhide_sha: ${{ steps.check.outputs.vpnhide_sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git gh

      - name: Make scripts executable
        run: chmod +x menu.sh scripts/*.sh sultan/gscripts/*.sh

      - name: Check upstream commits
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          (
            cd sultan
            bash gscripts/check-upstream.sh
          )

          # If manually triggered via workflow_dispatch, always build all targets and variants
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            CUR_CHANGES="$(grep -m1 '^has_changes=' "$GITHUB_OUTPUT" | cut -d= -f2 || true)"
            if [[ "$CUR_CHANGES" != "true" ]]; then
              echo "Workflow manually triggered: forcing build of all targets and variants."
              TARGETS=(gs201 zuma zumapro)
              VARIANTS=(ksu-susfs ksu-susfs-vpnhide ksu-next-susfs ksu-next-susfs-vpnhide)
              JSON='{"include":['
              FIRST=true
              for T in "${TARGETS[@]}"; do
                for V in "${VARIANTS[@]}"; do
                  if $FIRST; then FIRST=false; else JSON+=","; fi
                  JSON+="{\"target\":\"${T}\",\"variant\":\"${V}\"}"
                done
              done
              JSON+="]}"
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "matrix=$JSON" >> "$GITHUB_OUTPUT"
            fi
          fi

  build-nightly:
    name: "${{ matrix.target }} • ${{ matrix.variant }}"
    needs: check-upstream
    if: needs.check-upstream.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.check-upstream.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            git \
            gh \
            jq \
            libelf-dev \
            libssl-dev \
            lz4 \
            pahole \
            python3 \
            rsync \
            unzip \
            zip

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-nightly-${{ runner.os }}-${{ matrix.target }}
          restore-keys: |
            ccache-nightly-${{ runner.os }}-${{ matrix.target }}
            ccache-nightly-${{ runner.os }}

      - name: Ensure execution permissions
        run: chmod +x menu.sh scripts/*.sh sultan/gscripts/*.sh

      - name: Build Kernel
        run: |
          ./scripts/build_kernel.sh \
            --target "${{ matrix.target }}" \
            --variant "${{ matrix.variant }}" \
            --clean-temp \
            --no-check-upstream

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nightly_${{ matrix.target }}_${{ matrix.variant }}
          path: |
            release/*.zip
            release/nightly.json
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [check-upstream, build-nightly]
    runs-on: ubuntu-latest
    if: needs.check-upstream.outputs.has_changes == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded_artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          FILES=(downloaded_artifacts/*.zip)

          if (( ${#FILES[@]} == 0 )); then
            echo "No zip files found in artifacts. Skipping release creation."
            exit 1
          fi

          # Ensure nightly.json contains only global metadata (no target or variant)
          if [[ -f downloaded_artifacts/nightly.json ]]; then
            jq 'del(.target, .variant)' downloaded_artifacts/nightly.json > downloaded_artifacts/nightly_clean.json
            mv downloaded_artifacts/nightly_clean.json downloaded_artifacts/nightly.json
          fi

          BUILD_DATE="$(TZ='Asia/Novosibirsk' date +'%d.%m.%Y')"
          TAG="17.0.0-cp3a_${BUILD_DATE}"
          TITLE="Sultan 17.0.0-cp3a_${BUILD_DATE}"
          NOTES=$(cat <<'EOF'
          ### Automated Nightly Build of Sultan 17.0.0-cp3a

          Supported devices:
          - **gs201**: Pixel 7, 7 Pro, 7a
          - **zuma**: Pixel 8, 8 Pro, 8a
          - **zumapro**: Pixel 9, 9 Pro, 9 Pro XL, 9 Pro Fold

          Built with KernelSU, KernelSU-Next, SusFS, NoMount, and VPNHide.
          EOF
          )

          # Upload release assets using gh
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" downloaded_artifacts/nightly.json --clobber
          else
            gh release create "$TAG" "${FILES[@]}" downloaded_artifacts/nightly.json \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
          echo "Release successfully published: $TAG"
